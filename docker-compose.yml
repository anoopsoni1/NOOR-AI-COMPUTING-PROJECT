# MongoDB for NOOR. The backend itself runs on the host because it controls your desktop and browser.
services:
  mongo:
    image: mongo:7
    container_name: noor-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"   # bound to localhost only
    volumes:
      - noor-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  noor-mongo-data:
